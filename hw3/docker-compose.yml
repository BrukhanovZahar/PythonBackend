name: shop-monitoring

services:
  app:
    build:
      context: ..
      dockerfile: hw3/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    extends:
      file: ../hw4/docker-compose.yml
      service: postgres

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./settings/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./settings/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./settings/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
